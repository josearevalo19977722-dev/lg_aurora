<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1920, initial-scale=1.0" />
  <title>Aurora</title>
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <div class="wall" id="wall"></div>
  <div class="scrim" id="scrim"></div>
  <!-- Dos capas: el degradado no se puede animar, asi que el cambio
       de color se hace fundiendo opacidades, que si compone la GPU. -->
  <div class="glow on" id="glow1"></div>
  <div class="glow" id="glow2"></div>

  <header class="top">
    <div class="when">
      <div class="greeting" id="greeting">BUENAS NOCHES</div>
      <div class="clockline">
        <span class="clock" id="clock">--:--</span>
        <span class="ampm" id="ampm"></span>
        <span class="sep"></span>
        <span class="date" id="date"></span>
      </div>
    </div>

    <nav class="pills" id="pills">
      <button class="pill" data-act="inputs">
        <span class="ic ic-hdmi"></span><span>Entradas</span>
      </button>
      <button class="pill" data-act="net">
        <span class="ic ic-wifi"></span><span id="netlabel">Red</span>
      </button>
      <button class="pill" data-act="settings">
        <span class="ic ic-gear"></span><span>Ajustes</span>
      </button>
    </nav>

    <div class="panel" id="panel" hidden></div>
  </header>

  <!-- Escenario: solo en la vista completa; la barra lo oculta.
       Se llama "arte" y no "panel" porque .panel ya lo usa el desplegable
       de entradas de la cabecera. -->
  <section class="escena" id="escena">
    <div class="arte" id="artePanel"><img id="arteImg" alt=""></div>
    <div class="marca">
      <div class="titulo" id="titulo"></div>
      <div class="meta" id="meta"></div>
    </div>
  </section>

  <div class="raildock"></div>
  <main class="rail" id="rail">
    <div class="loading">Cargando aplicaciones…</div>
  </main>

  <script src="modo.js"></script>
  <!-- Lo genera el script de arranque 35-aurora-datos. Si falta,
       la app recurre al bus como antes. -->
  <script src="datos.js"></script>
  <script src="app.js"></script>
</body>
</html>
